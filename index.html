<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XERQOVA PANEL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#101a2d;border-bottom:2px solid #168bff}
header h1{margin:0;color:#36a5ff}
header p{color:#c4d8ef}
nav{display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
button{background:#168bff;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
main{max-width:850px;margin:auto;padding:15px}
.card{background:#111b2c;padding:18px;border-radius:12px;margin:15px 0;border:1px solid #243957}
input,select{width:100%;padding:13px;margin:8px 0 14px;border-radius:7px;border:1px solid #344b6b;background:#080f1c;color:white}
label{font-size:14px;color:#cbdaf0}
h2{color:#43adff}
.price{color:#42f5a1;font-size:21px;font-weight:bold}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#9aacc4}
</style>
</head>
<body>

<header>
<h1>XERQOVA PANEL</h1>
<p>Gaming Panel Selling Store</p>
</header>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('register')">Register</button>
<button onclick="showPage('login')">Login</button>
</nav>

<main>
<section id="home">
<div class="card">
<h2>Welcome to XERQOVA</h2>
<p>তোমার পছন্দের গেমিং প্রোডাক্ট বেছে নাও।</p>
<button onclick="showPage('register')">Create Account</button>
</div>

<h2>Our Products</h2>

<div class="card">
<h3>Non-Root Panel</h3>
<p>Non-Root ক্যাটাগরির প্রোডাক্ট</p>
<p class="price">৳ 100</p>
<button onclick="buy('Non-Root Panel',100)">Buy Now</button>
</div>

<div class="card">
<h3>Root Panel</h3>
<p>Root ক্যাটাগরির প্রোডাক্ট</p>
<p class="price">৳ 200</p>
<button onclick="buy('Root Panel',200)">Buy Now</button>
</div>
</section>

<section id="register" class="hidden">
<div class="card">
<h2>Create Account</h2>
<form onsubmit="registerUser(event)">
<label>তোমার নাম</label>
<input id="regName" type="text" placeholder="তোমার নাম লেখো" required>

<label>মোবাইল নম্বর</label>
<input id="regPhone" type="tel" inputmode="tel"
placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" required>

<label>পাসওয়ার্ড</label>
<input id="regPass" type="password"
placeholder="কমপক্ষে 6 অক্ষর" minlength="6" required>

<button type="submit">Register Now</button>
</form>
<p id="regMessage"></p>
</div>
</section>

<section id="login" class="hidden">
<div class="card">
<h2>Login</h2>
<form onsubmit="loginUser(event)">
<label>মোবাইল নম্বর</label>
<input id="loginPhone" type="tel" inputmode="tel"
placeholder="01XXXXXXXXX" required>

<label>পাসওয়ার্ড</label>
<input id="loginPass" type="password"
placeholder="তোমার পাসওয়ার্ড" required>

<button type="submit">Login</button>
</form>
<p id="loginMessage"></p>
</div>
</section>
</main>

<footer>
<p>© 2026 XERQOVA PANEL</p>
</footer>

<script>
function showPage(page){
document.querySelectorAll('main section').forEach(s=>{
s.classList.add('hidden');
});
document.getElementById(page).classList.remove('hidden');
window.scrollTo(0,0);
}

function registerUser(e){
e.preventDefault();
document.getElementById('regMessage').textContent = klকি লাগবে
'ফর্ম পূরণ হয়েছে। নিরাপদ অ্যাকাউন্ট তৈরির জন্য সার্ভার সংযোগ প্রয়োজন।';
}

function loginUser(e){
e.preventDefault();
document.getElementById('loginMessage').textContent =
'Login চালু করতে সার্ভার ও অ্যাকাউন্ট সিস্টেম প্রয়োজন।';
}

function buy(product,price){
const whatsapp = '8801723795558;
const message = `আমি ${product} কিনতে চাই। দাম: ৳${price}`;
window.open('https://wa.me/'+whatsapp+'?text='+encodeURIComponent(message),'_blank');
}
</script>

</body>
</html>
